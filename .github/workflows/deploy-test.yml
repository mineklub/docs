name: Test deployment

on:
  pull_request:
    branches:
      - main

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm install
      - name: Check Astro types
        run: npm run typecheck
      - name: Run Oxlint
        run: npm run lint
      - name: Test Astro build
        run: npm run build
      - name: Validate translations and published routes
        run: npm run test:i18n